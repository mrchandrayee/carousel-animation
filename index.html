<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1d1b1f">
<title>Carousel Animation</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <header class="header"><h1>Carousel Animation</h1></header>
  <section class="case-studies" aria-label="Animated slide carousel">
    <div class="carousel-window" id="carousel-window">
      <div class="carousel-track" id="carousel-track">
        <article class="case-card"><h2>SLIDE 1</h2></article>
        <article class="case-card"><h2>SLIDE 2</h2></article>
        <article class="case-card"><h2>SLIDE 3</h2></article>
        <article class="case-card"><h2>SLIDE 4</h2></article>
        <article class="case-card"><h2>SLIDE 5</h2></article>
        <article class="case-card"><h2>SLIDE 6</h2></article>
      </div>
    </div>
    <div class="carousel-controls">
      <button class="nav-button prev" id="prev" type="button" aria-label="Previous slides">‹</button>
      <div class="carousel-pagination" id="pagination" aria-label="Choose slide"></div>
      <button class="nav-button next" id="next" type="button" aria-label="Next slides">›</button>
    </div>
  </section>
</main>
<script src="script.js"></script>
</body>
</html>
